# Runs behind hand_warmer's nginx (shared `edge` network). Bring hand_warmer up first.
networks:
  edge:
    external: true

services:
  shark-backend:
    build: .
    container_name: shark-backend
    env_file: .env
    environment:
      BACKEND_PORT: "8000"
      # Outbound LLM calls go through hand_warmer's egress-proxy (IPv6-only host).
      HTTPS_PROXY: http://host.docker.internal:8888
      HTTP_PROXY: http://host.docker.internal:8888
      NO_PROXY: localhost,127.0.0.1
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - edge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
